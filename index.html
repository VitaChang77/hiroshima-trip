<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>廣島親子吃貨之旅 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #f8fafc; color: #334155; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .card-shadow { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); }
        .btn-nav { transition: all 0.2s; }
        .btn-nav.active { color: #ea580c; font-weight: 700; }
        
        /* 特殊標籤樣式 */
        .tag-food { background-color: #ffedd5; color: #9a3412; border: 1px solid #fdba74; }
        .tag-buy { background-color: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; }
        .tag-warn { background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    </style>
</head>
<body x-data="appData()" x-init="initWeather()" class="bg-slate-50 h-screen flex flex-col overflow-hidden">

    <header class="bg-white px-5 py-3 shadow-sm z-20 flex-none border-b border-gray-100">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-slate-800 tracking-tight">廣島親子遊 👨‍👩‍👧‍👦</h1>
                <p class="text-xs text-slate-500">2026/02/08 - 02/12</p>
            </div>
            <div class="text-right bg-blue-50 px-3 py-1 rounded-lg">
                <div class="text-sm font-bold text-blue-700" x-text="currentWeather.temp + '°C'">--°C</div>
                <div class="text-xs text-blue-500" x-text="currentWeather.desc">廣島市</div>
            </div>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto no-scrollbar p-4 pb-28 relative">
        
        <div x-show="activeTab === 'itinerary'">
            
            <div class="flex space-x-2 overflow-x-auto pb-2 no-scrollbar mb-4 sticky top-0 z-10 bg-slate-50/95 backdrop-blur py-2">
                <template x-for="(day, index) in itinerary" :key="index">
                    <button @click="activeDay = index" 
                        :class="{'bg-slate-800 text-white shadow-md transform scale-105': activeDay === index, 'bg-white text-slate-500 border border-slate-200': activeDay !== index}"
                        class="px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap transition-all">
                        <span x-text="day.shortDate"></span>
                    </button>
                </template>
            </div>

            <div x-show="activeDay === 3" class="mb-4 bg-white p-2 rounded-xl shadow-sm border border-slate-200 flex">
                <button @click="planMode = 'snow'" :class="{'bg-blue-500 text-white': planMode === 'snow', 'text-slate-500': planMode !== 'snow'}" class="flex-1 py-2 rounded-lg text-sm font-bold transition-colors">❄️ 玩雪模式</button>
                <button @click="planMode = 'rain'" :class="{'bg-amber-500 text-white': planMode === 'rain', 'text-slate-500': planMode !== 'rain'}" class="flex-1 py-2 rounded-lg text-sm font-bold transition-colors">☔ 雨天備案</button>
            </div>

            <div class="space-y-6">
                <h2 class="text-lg font-bold text-slate-700 ml-1" x-text="itinerary[activeDay].fullDate"></h2>

                <template x-for="item in getCurrentEvents()" :key="item.time">
                    <div class="bg-white rounded-2xl p-4 card-shadow border border-slate-100 relative">
                        <div class="flex justify-between items-start mb-2">
                            <div class="flex items-center space-x-2">
                                <span class="text-sm font-mono font-bold text-slate-400" x-text="item.time"></span>
                                <span class="px-2 py-0.5 rounded text-xs font-bold" :class="getTypeBadge(item.type)" x-text="item.typeLabel"></span>
                            </div>
                            <a :href="'https://www.google.com/maps/search/?api=1&query=' + item.query" target="_blank" 
                               class="bg-slate-50 text-slate-400 hover:bg-blue-50 hover:text-blue-600 rounded-full p-2 transition border border-slate-100">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                            </a>
                        </div>
                        
                        <h3 class="text-lg font-bold text-slate-800 mb-1 leading-tight" x-text="item.title"></h3>
                        <p class="text-sm text-slate-500 mb-3" x-text="item.desc"></p>

                        <div x-show="item.food" class="bg-orange-50 rounded-xl p-3 mb-3 border border-orange-100">
                            <div class="flex items-center mb-1 text-orange-800 font-bold text-sm">
                                <span class="mr-1">🍽️</span> 爸媽必吃推薦
                            </div>
                            <div class="font-bold text-slate-800" x-text="item.food?.name"></div>
                            <div class="text-xs text-slate-600 mt-1" x-text="item.food?.desc"></div>
                            <div x-show="item.food?.tip" class="text-xs text-orange-600 mt-1 font-medium">
                                <span class="bg-orange-200 text-orange-800 px-1 rounded text-[10px]">Tips</span> <span x-text="item.food?.tip"></span>
                            </div>
                        </div>

                        <div class="flex flex-wrap gap-2">
                            <template x-for="tag in item.tags">
                                <span class="text-xs px-2.5 py-1 rounded-md font-bold shadow-sm" 
                                    :class="{
                                        'tag-food': tag.type === 'eat',
                                        'tag-buy': tag.type === 'buy',
                                        'tag-warn': tag.type === 'warn',
                                        'bg-slate-100 text-slate-500': tag.type === 'normal'
                                    }" x-text="tag.text"></span>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
            
            <div class="h-10"></div>
        </div>

        <div x-show="activeTab === 'checklist'" class="space-y-6">
            <h2 class="text-xl font-bold text-slate-800 mb-4">🎒 出發前確認清單</h2>
            
            <template x-for="(group, gIndex) in checklist" :key="gIndex">
                <div class="bg-white rounded-xl p-4 card-shadow">
                    <h3 class="font-bold text-slate-700 mb-3 border-b border-slate-100 pb-2 flex items-center">
                        <span x-text="group.icon" class="mr-2 text-lg"></span>
                        <span x-text="group.title"></span>
                    </h3>
                    <div class="space-y-3">
                        <template x-for="(item, iIndex) in group.items" :key="iIndex">
                            <label class="flex items-start space-x-3 p-1 active:bg-slate-50 rounded cursor-pointer">
                                <input type="checkbox" class="w-5 h-5 rounded text-blue-600 focus:ring-blue-500 mt-0.5 border-gray-300" x-model="item.checked">
                                <div :class="{'opacity-40 line-through': item.checked}">
                                    <div class="text-sm font-medium text-slate-800" x-text="item.name"></div>
                                    <div class="text-xs text-slate-500" x-text="item.desc" x-show="item.desc"></div>
                                </div>
                            </label>
                        </template>
                    </div>
                </div>
            </template>
        </div>

        <div x-show="activeTab === 'tools'" class="space-y-4">
             <div class="bg-white rounded-xl p-5 card-shadow border-l-4 border-indigo-500">
                <h3 class="font-bold text-lg mb-2 flex items-center text-indigo-900">🏨 飯店資訊</h3>
                <p class="font-bold text-slate-800">Hotel Granvia Hiroshima South Gate</p>
                <p class="text-sm text-slate-500 mt-1">廣島車站直結 / 新幹線口</p>
                <div class="mt-3 flex space-x-2">
                    <a href="https://maps.app.goo.gl/GranviaHiroshima" target="_blank" class="flex-1 bg-indigo-50 text-indigo-700 text-center py-2 rounded-lg text-sm font-bold">打開地圖</a>
                    <a href="tel:+81822621111" class="flex-1 bg-slate-50 text-slate-600 text-center py-2 rounded-lg text-sm font-bold">撥打電話</a>
                </div>
            </div>

            <div class="bg-red-50 rounded-xl p-5 border border-red-100">
                <h3 class="font-bold text-red-800 mb-2">🆘 緊急聯絡</h3>
                <div class="grid grid-cols-2 gap-4 text-sm">
                    <div>
                        <span class="block text-red-400 text-xs">報警</span>
                        <span class="font-mono font-bold text-xl text-red-700">110</span>
                    </div>
                    <div>
                        <span class="block text-red-400 text-xs">救護車</span>
                        <span class="font-mono font-bold text-xl text-red-700">119</span>
                    </div>
                    <div class="col-span-2 border-t border-red-100 pt-2">
                        <span class="block text-red-400 text-xs">台北駐大阪辦事處</span>
                        <a href="tel:+81662278623" class="font-mono font-bold text-red-700 block">+81-6-6227-8623</a>
                    </div>
                </div>
            </div>
            
            <div class="text-center text-xs text-slate-400 mt-8">
                Made for the best family trip ❤️
            </div>
        </div>

    </main>

    <nav class="bg-white border-t border-slate-200 flex-none pb-safe z-30">
        <div class="flex justify-around items-center h-16">
            <button @click="activeTab = 'itinerary'" class="btn-nav flex flex-col items-center justify-center w-full h-full text-slate-400" :class="{'active': activeTab === 'itinerary'}">
                <span class="text-2xl mb-0.5">🗓️</span>
                <span class="text-xs">行程</span>
            </button>
            <button @click="activeTab = 'checklist'" class="btn-nav flex flex-col items-center justify-center w-full h-full text-slate-400" :class="{'active': activeTab === 'checklist'}">
                <span class="text-2xl mb-0.5">🎒</span>
                <span class="text-xs">清單</span>
            </button>
            <button @click="activeTab = 'tools'" class="btn-nav flex flex-col items-center justify-center w-full h-full text-slate-400" :class="{'active': activeTab === 'tools'}">
                <span class="text-2xl mb-0.5">🧰</span>
                <span class="text-xs">工具</span>
            </button>
        </div>
    </nav>

    <script>
        function appData() {
            return {
                activeTab: 'itinerary',
                activeDay: 0,
                planMode: 'rain', // 預設雨天備案 (可切換 snow)
                currentWeather: { temp: '-', desc: '讀取中' },

                // 行李清單資料
                checklist: [
                    {
                        title: "絕對必帶", icon: "🛂",
                        items: [
                            { name: "護照", desc: "效期需6個月以上", checked: false },
                            { name: "Visit Japan Web截圖", desc: "每人都要有", checked: false },
                            { name: "網卡/漫遊", desc: "確認已開通", checked: false },
                            { name: "日幣現金 & 信用卡", desc: "JCB/Visa備用", checked: false }
                        ]
                    },
                    {
                        title: "小孩專用 (2.5y & 9y)", icon: "👶",
                        items: [
                            { name: "尿布", desc: "多帶幾片備用", checked: false },
                            { name: "濕紙巾/酒精", desc: "隨身包", checked: false },
                            { name: "安撫零食", desc: "米餅、果凍", checked: false },
                            { name: "水壺", desc: "日本很乾", checked: false },
                            { name: "常備藥", desc: "退燒、止咳、益生菌", checked: false },
                            { name: "推車雨罩", desc: "防風防雨", checked: false }
                        ]
                    },
                    {
                        title: "冬日衣物", icon: "🧣",
                        items: [
                            { name: "防水手套/毛帽", desc: "玩雪必備", checked: false },
                            { name: "厚襪子", desc: "多帶幾雙替換", checked: false },
                            { name: "防風外套", desc: "洋蔥式穿法", checked: false }
                        ]
                    }
                ],

                // 行程資料
                itinerary: [
                    {
                        shortDate: 'D1 (日)', fullDate: 'Day 1: 抵達 & 補給 (2/8)',
                        events: [
                            { 
                                time: '10:15', type: 'transport', typeLabel: '交通', title: '抵達廣島', desc: '機場巴士 -> 廣島站 (約50分)。先去飯店放行李。', query: 'Hotel Granvia Hiroshima South Gate', tags: [] 
                            },
                            { 
                                time: '12:30', type: 'food', typeLabel: '午餐', title: 'ekie 美食街', desc: '選擇多，不用走遠。', query: 'ekie Hiroshima', tags: [],
                                food: { name: '麗ちゃん (Rei-chan)', desc: 'ekie 1F / 廣島燒名店', tip: '如果排隊太長，直接點外帶回房間吃！' }
                            },
                            { 
                                time: '14:00', type: 'spot', typeLabel: '景點', title: 'Pokémon Center', desc: 'ekie 2F / 全新開幕旗艦店！', query: 'Pokemon Center Hiroshima Ekie', tags: [{text:'必拍紅色暴鯉龍', type:'eat'}, {text:'買限定版皮卡丘', type:'buy'}] 
                            },
                            { 
                                time: '16:00', type: 'spot', typeLabel: '購物', title: 'Montbell (紙屋町)', desc: '搭電車去 Sunmall 1F / 紙屋町東站。', query: 'Montbell Hiroshima Kamiyacho', tags: [{text:'補齊雪靴手套', type:'buy'}] 
                            },
                            { 
                                time: '18:30', type: 'food', typeLabel: '晚餐', title: 'ekie 1F 牡蠣大餐', desc: '回飯店樓下吃，吃完秒睡。', query: 'Kanawa Ekie', tags: [{text:'必點土手鍋', type:'eat'}],
                                food: { name: 'Kanawa (かなわ)', desc: '生食級牡蠣 / 牡蠣土手鍋', tip: '湯汁拌飯小孩超愛，環境舒適。' }
                            },
                            {
                                time: 'Takeout', type: 'spot', typeLabel: '必買', title: '八天堂奶油麵包', desc: 'ekie 1F / 買幾個冰在飯店冰箱當早餐或點心。', query: 'Hattendo Ekie', tags: [{text:'廣島名產', type:'buy'}]
                            }
                        ]
                    },
                    {
                        shortDate: 'D2 (一)', fullDate: 'Day 2: 宮島一日遊 (2/9)',
                        events: [
                            { time: '09:30', type: 'transport', typeLabel: '出發', title: '前往宮島口', desc: 'JR 山陽本線 (約30分)。', query: 'Miyajimaguchi Station', tags: [] },
                            { 
                                time: '10:10', type: 'food', typeLabel: '必買', title: '上野星鰻便當', desc: '宮島口車站旁。', query: 'Anagomeshi Ueno', tags: [{text:'全日本第一便當', type:'eat'}],
                                food: { name: 'あなごめし うえの', desc: '便當 (Bento)', tip: '不要內用排隊，直接買便當帶去宮島野餐。' }
                            },
                            { time: '10:30', type: 'spot', typeLabel: '景點', title: '嚴島神社 & 鹿', desc: '搭渡輪。注意鹿會吃紙！', query: 'Itsukushima Jinja', tags: [{text:'推車可上船', type:'normal'}] },
                            { 
                                time: '12:30', type: 'food', typeLabel: '午餐', title: '表參道商店街', desc: '牡蠣屋或邊走邊吃。', query: 'Yakigaki no Hayashi', tags: [],
                                food: { name: '焼がきのはやし', desc: '烤牡蠣發源地', tip: '店面大，帶小孩方便。必點烤牡蠣。' }
                            },
                            { 
                                time: '13:30', type: 'spot', typeLabel: '點心', title: '炸紅葉饅頭', desc: '紅葉堂 (Momijido)。', query: 'Momijido', tags: [{text:'小孩超愛', type:'eat'}],
                                food: { name: '揚げもみじ', desc: '炸紅葉饅頭', tip: '熱騰騰像雞蛋糕，外酥內軟。' }
                            },
                            { time: '14:30', type: 'spot', typeLabel: '景點', title: '宮島水族館', desc: '有企鵝、室內休息區。', query: 'Miyajima Public Aquarium', tags: [{text:'親子友善', type:'normal'}] }
                        ]
                    },
                    {
                        shortDate: 'D3 (二)', fullDate: 'Day 3: 廣島市區美食 (2/10)',
                        events: [
                            { time: '10:00', type: 'spot', typeLabel: '耍廢', title: '睡到自然醒', desc: '享受悠閒早晨，飯店附近散步。', query: 'Hiroshima Station', tags: [] },
                            { 
                                time: '12:00', type: 'food', typeLabel: '午餐', title: '本通商店街', desc: '搭車去本通逛逛。', query: 'Suishin Honten', tags: [],
                                food: { name: '酔心 (Suishin)', desc: '牡蠣釜飯', tip: '廣島鄉土料理名店，有榻榻米座位，非常適合帶小孩。' }
                            },
                            { time: '14:00', type: 'spot', typeLabel: '點心', title: 'Andersen 麵包', desc: '安徒生麵包總本店。', query: 'Andersen Hiroshima', tags: [{text:'牛奶麵包必買', type:'eat'}] },
                            { 
                                time: '17:30', type: 'food', typeLabel: '晚餐', title: 'ekie 壽司', desc: '早點去排隊！', query: 'Sushi Tatsu Ekie', tags: [{text:'不接受預約', type:'warn'}],
                                food: { name: 'すし辰 (Sushi Tatsu)', desc: '迴轉壽司', tip: '若排太久直接外帶回房間吃！必點炙燒鯖魚。' }
                            }
                        ]
                    },
                    {
                        shortDate: 'D4 (三)', fullDate: 'Day 4: 玩雪 or 玩Mall (2/11)',
                        events: [] // 動態載入
                    },
                    {
                        shortDate: 'D5 (四)', fullDate: 'Day 5: 快樂回家 (2/12)',
                        events: [
                            { time: '09:00', type: 'transport', typeLabel: '交通', title: '利木津巴士', desc: '前往廣島機場。', query: 'Hiroshima Station', tags: [{text:'檢查護照', type:'warn'}] },
                            { time: '11:15', type: 'transport', typeLabel: '飛機', title: 'CI113 返台', desc: '平安回家。', query: 'Hiroshima Airport', tags: [] }
                        ]
                    }
                ],

                // D4 的兩個版本行程
                d4_plans: {
                    snow: [
                        { time: '08:00', type: 'transport', typeLabel: '瘋狂', title: '新幹線玩雪', desc: '廣島 -> 新神戶 -> 六甲山雪樂園。', query: 'Rokko Snow Park', tags: [{text:'人工雪保證有', type:'normal'}] },
                        { time: '11:00', type: 'spot', typeLabel: '玩雪', title: 'Snow Land', desc: '租雪盆、堆雪人。', query: 'Rokko Snow Park', tags: [{text:'記得租裝備', type:'buy'}] }
                    ],
                    rain: [
                        { time: '10:30', type: 'transport', typeLabel: '備案', title: 'Aeon Mall 府中', desc: '搭JR一站到天神川站。', query: 'Aeon Mall Hiroshima Fuchu', tags: [{text:'最強雨備', type:'normal'}] },
                        { 
                            time: '11:00', type: 'spot', typeLabel: '姊姊', title: 'VS PARK', desc: '室內運動綜藝場，猛獸大賽跑！', query: 'VS PARK Aeon Mall', tags: [{text:'放電神器', type:'eat'}] 
                        },
                        { 
                            time: '11:00', type: 'spot', typeLabel: '弟弟', title: 'Kid\'s Republic', desc: '3F 免費遊戲區 & 玩具反斗城。', query: 'Toys R Us Aeon Mall Hiroshima', tags: [{text:'爸媽輪流逛', type:'normal'}] 
                        },
                        { 
                            time: '12:30', type: 'food', typeLabel: '午餐', title: '1F 美食街', desc: '選擇多，有兒童座椅。', query: 'Aeon Mall Hiroshima Fuchu', tags: [] 
                        }
                    ]
                },

                // 取得當前行程 (處理 D4 切換邏輯)
                getCurrentEvents() {
                    if (this.activeDay === 3) { // Day 4
                        return this.d4_plans[this.planMode];
                    }
                    return this.itinerary[this.activeDay].events;
                },

                getTypeBadge(type) {
                    if (type === 'transport') return 'bg-blue-100 text-blue-700';
                    if (type === 'food') return 'bg-orange-100 text-orange-800';
                    if (type === 'spot') return 'bg-emerald-100 text-emerald-800';
                    return 'bg-slate-100 text-slate-800';
                },

                async initWeather() {
                    try {
                        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=34.3853&longitude=132.4553&current_weather=true');
                        const data = await res.json();
                        this.currentWeather = {
                            temp: data.current_weather.temperature,
                            desc: '廣島市'
                        };
                    } catch (e) { console.log(e); }
                }
            }
        }
    </script>
</body>
</html>
