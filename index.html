<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>職場媽媽的戰利品清單</title>
    <style>
        :root {
            --primary: #d68080; /* 溫柔的乾燥玫瑰粉 */
            --bg: #fdfbf7;
            --text: #4a4a4a;
            --card-bg: #ffffff;
            --success: #81c784;
        }

        body {
            font-family: '微軟正黑體', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 20px;
        }

        /* 進度條 */
        .progress-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 20px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 10px;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* 分類標題 */
        .category-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin: 20px 0 10px 5px;
            border-left: 5px solid var(--primary);
            padding-left: 10px;
        }

        /* 清單卡片 */
        .item-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .item-card:active {
            transform: scale(0.98);
        }

        .item-info {
            flex-grow: 1;
        }

        .item-name {
            font-size: 1.1rem;
            font-weight: 600;
            display: block;
        }

        .item-note {
            font-size: 0.85rem;
            color: #888;
            margin-top: 4px;
        }

        /* Checkbox樣式 */
        .checkbox-custom {
            width: 24px;
            height: 24px;
            border: 2px solid var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 15px;
            transition: all 0.3s;
        }

        /* 已完成狀態 */
        .completed .item-name {
            text-decoration: line-through;
            color: #bbb;
        }
        
        .completed .checkbox-custom {
            background-color: var(--success);
            border-color: var(--success);
        }

        .completed .checkbox-custom::after {
            content: '✓';
            color: white;
            font-weight: bold;
        }

        .reset-btn {
            display: block;
            margin: 40px auto;
            padding: 10px 20px;
            background-color: #eee;
            border: none;
            border-radius: 20px;
            color: #666;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>🛍️ 媽媽的放風清單</h1>
        <p class="subtitle">忙碌中也要記得愛自己 (進度自動儲存)</p>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div id="listContent">
            </div>

        <button class="reset-btn" onclick="resetList()">重置清單 (全部清除)</button>
    </div>

    <script>
        // ==========================================
        // CONFIG: 請在這裡修改你的購物清單資料
        // ==========================================
        const defaultItems = [
            // --- 類別：之前的許願清單 (假設) ---
            { id: 1, category: "👗 之前的許願", name: "舒適好走的平底鞋", note: "上班追小孩兩相宜，要軟底的" },
            { id: 2, category: "👗 之前的許願", name: "修身西裝褲", note: "開會要有氣勢，但腰頭要舒服" },
            { id: 3, category: "👗 之前的許願", name: "大容量輕量托特包", note: "要能裝筆電跟小孩水壺" },

            // --- 類別：資深同事推薦 (科技業媽媽必備) ---
            { id: 4, category: "💻 同事推薦好物", name: "降噪耳機", note: "辦公室太吵或小孩太吵時的救贖" },
            { id: 5, category: "💻 同事推薦好物", name: "人體工學滑鼠 (垂直滑鼠)", note: "預防媽媽手跟滑鼠手" },
            { id: 6, category: "💻 同事推薦好物", name: "掃地機器人/洗地機", note: "你的時間該拿來追劇，不是掃地" },

            // --- 類別：給自己 (Self Care) ---
            { id: 7, category: "💆‍♀️ 寵愛自己", name: "高級護手霜", note: "辦公室冷氣房很乾" },
            { id: 8, category: "💆‍♀️ 寵愛自己", name: "好喝的濾掛咖啡/茶包", note: "下午三點的續命丹" },
            
            // --- 類別：給小孩 (任務) ---
            { id: 9, category: "👶 順便買小孩的", name: "學校備用文具", note: "永遠會消失的橡皮擦跟尺" },
        ];

        // ==========================================
        // 系統邏輯 (就像 ERP 的 Logic 層)
        // ==========================================
        
        const STORAGE_KEY = 'mom_shopping_list_v1';
        let items = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultItems;

        // 渲染畫面
        function renderList() {
            const container = document.getElementById('listContent');
            container.innerHTML = '';

            // 依類別分組
            const grouped = items.reduce((acc, item) => {
                (acc[item.category] = acc[item.category] || []).push(item);
                return acc;
            }, {});

            // 產生 HTML
            for (const [category, groupItems] of Object.entries(grouped)) {
                // 加入標題
                const titleDiv = document.createElement('div');
                titleDiv.className = 'category-title';
                titleDiv.textContent = category;
                container.appendChild(titleDiv);

                // 加入項目
                groupItems.forEach(item => {
                    const card = document.createElement('div');
                    card.className = `item-card ${item.checked ? 'completed' : ''}`;
                    card.onclick = () => toggleItem(item.id);

                    card.innerHTML = `
                        <div class="item-info">
                            <span class="item-name">${item.name}</span>
                            ${item.note ? `<div class="item-note">${item.note}</div>` : ''}
                        </div>
                        <div class="checkbox-custom"></div>
                    `;
                    container.appendChild(card);
                });
            }

            updateProgress();
        }

        // 切換勾選狀態
        function toggleItem(id) {
            const item = items.find(i => i.id === id);
            if (item) {
                item.checked = !item.checked;
                saveData();
                renderList();
            }
        }

        // 更新進度條
        function updateProgress() {
            const total = items.length;
            const checked = items.filter(i => i.checked).length;
            const percent = (checked / total) * 100;
            document.getElementById('progressBar').style.width = `${percent}%`;
        }

        // 儲存到 LocalStorage (瀏覽器記憶體)
        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
        }

        // 重置
        function resetList() {
            if(confirm('確定要全部清空重來嗎？')) {
                items = JSON.parse(JSON.stringify(defaultItems)); // Deep copy
                items.forEach(i => i.checked = false);
                saveData();
                renderList();
            }
        }

        // 初始化
        renderList();

    </script>
</body>
</html>
